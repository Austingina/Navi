/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5 #used for feats_undistort,
        filter_size_map: 0.5 #used for ikd-tree, incremental map
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "/home/nvidia/Navi/maps/lab525.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for any other pointcloud input
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: true                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: true      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame
        bbs3d:
            voxel_size: 0.15 # used for gicp 
            score_threshold: 0.9
            min_level_res: 0.3 #userd for bbs3d min level resolution
            max_level: 6  # 减少层数可缩小实际搜索范围
            xy_range: 25.0
            z_range: 5.0
        elevator_z_moving:
            enable: false
            AZ_TRIGGER_THRESH: 0.04
            AZ_RELEASE_THRESH: 0.015
            AZ_DEBOUNCE_COUNT: 50
            AZ_MOVING_TIMEOUT: 12000
            AZ_EMA_ALPHA: 0.05
        stationary_lock:
            enable: true
            chassis_speed_topic: "/motion_control/chassis_speed"
            v_thresh: 0.005
            w_thresh: 0.005
            min_dur: 0.3
            chassis_timeout: 0.5
        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
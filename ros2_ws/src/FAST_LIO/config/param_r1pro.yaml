velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 0.5]
    min_velocity: [-0.5, -0.5, -0.5]
    max_accel: [0.5, 0.5, 0.1]
    max_decel: [-0.5, -0.5, -0.1]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0    #成本地图更新频率
      publish_frequency: 10.0   #将成本图发布到话题的频率
      global_frame: map       #全局框架
      robot_base_frame: base_link  #机器人底座框架
      use_sim_time: False  #仿真时间
      transform_tolerance: 1.3  
      rolling_window: true #成本地图是否应随机器人基座框架滚动
      width: 10             #代价地图的宽度（m）
      height: 10            #代价地图的高度（m）
      resolution: 0.05     #代价地图1像素的分辨率，以米为单位
      #robot_radius: 0.20   #机器人半径，如果未提供足迹坐标，则使用机器人半径。
      footprint: "[ [-0.4, -0.4], [-0.4, 0.4],[0.4, 0.4],[0.4, -0.4] ]"
      #footprint: "[ [-0.15, -0.38], [-0.15, 0.38],[0.67,0.38],[0.67, -0.38] ]"
      #plugins: ["voxel_layer","obstacle_layer","inflation_layer"] #插件包括:{“体素层”，“障碍层”，“膨胀层”}
      plugins: ["obstacle_layer","inflation_layer"]
      inflation_layer:                             #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件。
        cost_scaling_factor: 3.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.75                     #膨胀半径
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: lidar_scan 
        footprint_clearing_enabled: True
        max_obstacle_height: 5.0
        min_obstacle_height: -5.0
        combination_method: 1
        pub_lidar_observation: False
        lidar_scan:
          topic: /livox_scan2
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          max_obstacle_height: 5.0
          min_obstacle_height: -5.0
          clearing: True
          marking: True
          observation_persistence: 3.0
          data_type: "LaserScan"
          inf_is_valid: false
        camera_scan:
          topic: /camera_scan
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 1.0
          min_obstacle_height: -1.0
          clearing: True
          marking: True
          observation_persistence: 1.0
          data_type: "LaserScan"
          inf_is_valid: false
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"      #体素层插件。
        enabled: False
        publish_voxel_map: True
        origin_z: 0.0                              #体素地图的起始Z坐标
        z_resolution: 0.05                         #体素地图的Z轴分辨率
        z_voxels: 16                               #体素地图的Z轴体素数量
        max_obstacle_height: 2.0                   #可检测障碍物的最大高度（米）
        mark_threshold: 0                          #标记体素的阈值
        observation_sources: cloud camera                  #观测源
        cloud:
          topic: /cloud_registered_body
          # sensor_frame: "base_link"
          max_obstacle_height: 2.0                  #可检测障碍物的最大高度（米）
          min_obstacle_height: -0.15                  #在global_frame坐标系下的高度
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          data_type: "PointCloud2"                    #数据类型
          raytrace_max_range: 10.0                  #控制光线追踪从代价地图中清除障碍物的最大范围
          raytrace_min_range: 0.0                   #控制光线追踪从代价地图中清除障碍物的最大范围
          obstacle_max_range: 5.0                   #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                   #控制代价地图上标记障碍物的最小范围
        camera:
          topic: /camera/depth/points
          # sensor_frame: "base_link"
          max_obstacle_height: 2.0                  #可检测障碍物的最大高度（米）
          min_obstacle_height: -0.15                  #在global_frame坐标系下的高度
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          data_type: "PointCloud2"                    #数据类型
          raytrace_max_range: 5.0                  #控制光线追踪从代价地图中清除障碍物的最大范围
          raytrace_min_range: 0.0                   #控制光线追踪从代价地图中清除障碍物的最大范围
          obstacle_max_range: 3.0                   #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                   #控制代价地图上标记障碍物的最小范围

      always_send_full_costmap: True                 #是否每次更新时都发送完整的成本图，而不是更新
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0             #成本地图更新频率
      publish_frequency: 10.0            #将成本图发布到话题的频率
      global_frame: map                 #全局框架
      robot_base_frame: base_link  #机器人底座框架
      use_sim_time: False               #仿真时间 
      transform_tolerance: 1.3  
      #robot_radius: 0.20                #机器人半径
      footprint: "[ [-0.4, -0.4], [-0.4, 0.4],[0.4, 0.4],[0.4, -0.4] ]"
      #footprint: "[ [-0.15, -0.38], [-0.15, 0.38],[0.67,0.38],[0.67, -0.38] ]"
      resolution: 0.05                  #全局地图1像素的分辨率，以米为单位
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] #插件包括：{“静态层”，“障碍层”，“膨胀层”}
      obstacle_layer:  #障碍层参数
        plugin: "nav2_costmap_2d::ObstacleLayer" #障碍层插件
        enabled: True
        combination_method: 1
        footprint_clearing_enabled: True
        min_obstacle_height: -5.0
        max_obstacle_height: 5.0
        observation_sources: scan                  #观测源
        scan:
          topic: /livox_scan2
          # queue_size: 10
          max_obstacle_height: 5.0                 #可检测障碍物的最大高度（米）
          min_obstacle_height: -5.0
          observation_persistence: 3.0
          clearing: True                           #是否启用障碍物清除功能
          marking: True                            #是否启用障碍物标记功能
          data_type: "LaserScan"                   #数据类型
          raytrace_max_range: 10.0                 #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 8.0                  #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                  #控制代价地图上标记障碍物的最小范围
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"      #体素层插件。
        enabled: False
        publish_voxel_map: True
        origin_z: 0.0                              #体素地图的起始Z坐标
        z_resolution: 0.05                         #体素地图的Z轴分辨率
        z_voxels: 16                               #体素地图的Z轴体素数量
        max_obstacle_height: 2.0                   #可检测障碍物的最大高度（米）
        mark_threshold: 0                          #标记体素的阈值
        observation_sources: cloud                  #观测源
        cloud:
          topic: /cloud_registered_body
          # sensor_frame: "base_link"
          max_obstacle_height: 2.0                  #可检测障碍物的最大高度（米）
          min_obstacle_height: -0.15                  #在global_frame坐标系下的高度
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          data_type: "PointCloud2"                    #数据类型
          raytrace_max_range: 10.0                  #控制光线追踪从代价地图中清除障碍物的最大范围
          raytrace_min_range: 0.0                   #控制光线追踪从代价地图中清除障碍物的最大范围
          obstacle_max_range: 5.0                   #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                   #控制代价地图上标记障碍物的最小范围
      static_layer: #静态层参数
        plugin: "nav2_costmap_2d::StaticLayer"     #静态层插件
        map_subscribe_transient_local: True
        footprint_clearing_enabled: True
      inflation_layer: #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件
        cost_scaling_factor: 10.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.7                     #膨胀半径
      always_send_full_costmap: false               #是否每次更新时都发送完整的成本图，而不是更新
  global_costmap_client:
    ros__parameters:
      use_sim_time: False

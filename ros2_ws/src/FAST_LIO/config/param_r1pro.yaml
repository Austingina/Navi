bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False # 是否使用仿真时间
    controller_frequency: 5.0 # 控制器运行频率（Hz）
    min_x_velocity_threshold: 0.01 # x方向最小速度阈值
    min_y_velocity_threshold: 0.01 # y方向最小速度阈值
    min_theta_velocity_threshold: 0.08 # 角速度最小阈值
    failure_tolerance: 0.3 # 允许失败的容忍度
    progress_checker_plugin: "progress_checker" # 进度检查插件名称
    goal_checker_plugins: ["general_goal_checker"] # 目标检查插件列表
    controller_plugins: ["FollowPath"] # 控制器插件列表

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker" # 进度检查插件类型
      required_movement_radius: 0.2 # 所需移动半径（米）
      movement_time_allowance: 10.0 # 允许移动时间（秒）
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True # 是否有状态
      plugin: "nav2_controller::SimpleGoalChecker" # 目标检查插件类型
      xy_goal_tolerance: 0.60 # 目标点xy容差（米）
      yaw_goal_tolerance: 0.1 # 目标点yaw容差（弧度）
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner" # 路径跟随插件类型
      debug_trajectory_details: True # 是否调试轨迹细节
      min_vel_x: 0.0 # x方向最小速度
      max_vel_x: 0.3 # x方向最大速度
      min_vel_y: -0.1 # y方向最小速度
      max_vel_y: 0.1 # y方向最大速度
      min_vel_theta: -0.5 # 最小角速度
      max_vel_theta: 0.5 # 最大角速度
      # min_speed_xy: -0.26 # xy平面最小速度
      max_speed_xy: 0.3 # xy平面最大速度
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5 # x方向最大加速度
      acc_lim_y: 2.5 # y方向最大加速度
      acc_lim_theta: 3.2 # 最大角加速度
      decel_lim_x: -2.5 # x方向最大减速度
      decel_lim_y: -2.5 # y方向最大减速度
      decel_lim_theta: -3.2 # 最大角减速度
      vx_samples: 10 # x方向速度采样数
      vy_samples: 10 # y方向速度采样数
      vtheta_samples: 20 # 角速度采样数
      sim_time: 1.7 # 仿真时间（秒）
      linear_granularity: 0.05 # 线速度粒度
      angular_granularity: 0.025 # 角速度粒度
      transform_tolerance: 0.3 # TF变换容差
      xy_goal_tolerance: 0.50 # 目标点xy容差（米）
      trans_stopped_velocity: 0.05 # 判定停止的速度阈值
      short_circuit_trajectory_evaluation: True # 是否启用短路轨迹评估
      stateful: True # 是否有状态
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "HeadingAlign", "PathDist", "GoalDist"] # 评价器插件列表
      BaseObstacle.scale: 0.02 # 障碍物评价器权重
      HeadingAlign.scale: 8.0 # 航向对齐评价器权重
      HeadingAlign.forward_point_distance: 0.5 # 航向对齐前向
      GoalAlign.scale: 24.0 # 目标对齐评价器权重
      GoalAlign.forward_point_distance: 0.5 # 目标对齐前向点距离
      PathDist.scale: 32.0 # 路径距离评价器权重
      GoalDist.scale: 24.0 # 目标距离评价器权重
      RotateToGoal.scale: 32.0 # 旋转到目标评价器权重
      RotateToGoal.slowing_factor: 5.0 # 旋转减速因子
      RotateToGoal.lookahead_time: -2.0 # 旋转预判时间
      Oscillation.scale: 32.0 # 振荡评价器权重
      

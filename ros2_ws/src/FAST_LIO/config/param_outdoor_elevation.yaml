bt_navigator:
  ros__parameters:
    transform_tolerance: 0.5 # 仿真时为 0.5, 真实时为 0.1
    goal_reached_tol: 0.25
    global_frame: map
    robot_base_frame: base_link
    enable_groot_monitoring: true
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    odom_topic: /odom
    bt_loop_duration: 100
    default_server_timeout: 200
    default_nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery.xml"
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery.xml"
    # plugin_lib_names is only for custom BT plugins -- listing the built-in
    # nav2 ones here makes bt_navigator abort with "ID [...] already registered".
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.08
    failure_tolerance: 3.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "precise_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 室外 + 普通 GPS 精度（数米），到点容差放大；要精确到点需 RTK 并调小。
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 3.14
    # campus_nav 的路线终点专用（由 navigate_to_pose_precise_goal.xml 的
    # FollowPath 以 goal_checker_id 选中）。中途路点仍走 general_goal_checker。
    precise_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # 允许小幅后退（-0.1）：窄路里前进轨迹全被 ObstacleFootprint 判死时，
      # 后退轨迹经已走过的 FREE 区域仍合法，可以小幅倒车换姿态脱困。
      # 不想经常后退：范围小（10 样本里只有 2 个负值）+ Oscillation critic
      # （scale 32）惩罚换向，前进可行时 DWB 不会选后退。
      min_vel_x: -0.1
      max_vel_x: 0.5
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_vel_theta: -0.5
      max_vel_theta: 0.5
      max_speed_xy: 0.8
      acc_lim_x: 2.5
      acc_lim_y: 2.5
      acc_lim_theta: 2.2
      decel_lim_x: -2.5
      decel_lim_y: -2.5
      decel_lim_theta: -3.2
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 1.0
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      # ObstacleFootprint 检查整条轨迹上 footprint 的每一点，车角压上 lethal 即判非法
      # —— "车身不撞"的正确工具。前提是 scan 的 range_min 已滤掉自车点(见
      # elevation_mapping_cupy_fastlio.launch.py 的 range_min=0.45)，否则整圈撞上
      # 自己、所有轨迹判死，车停着不动。
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "HeadingAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 1.5
      HeadingAlign.class: heading_align_critic::HeadingAlignCritic
      HeadingAlign.scale: 8.0
      HeadingAlign.forward_point_distance: 0.5
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.5
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -2.0
      Oscillation.scale: 32.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.5]
    min_velocity: [-0.5, 0.0, -0.5]
    # 角加速度 0.8→0.3：DWB 原地转向 0→0.5 rad/s 爬坡约 1.7s，覆盖底盘摆轮窗口
    # (~1.2s)。摆轮期间轮速小、过冲小，避免原地转向启动时车身被甩出 60~115°/s。
    max_accel: [2.5, 0.5, 0.3]
    max_decel: [-2.5, -0.5, -0.6]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# -----------------------------------------------------------------------------
# 碰撞监视器：速度链的最后一跳 cmd_vel_smoothed -> cmd_vel（底盘只订阅 /cmd_vel）。
# 不启用它就没人发 /cmd_vel，车原地不动、controller 反复报 Failed to make progress。
# observation_sources 是必填项，缺了节点在 configure 阶段就会死并拖崩整个 bringup。
# -----------------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    # /livox_scan2 约 10 Hz，1 s 内收不到就认为传感器失效并刹停。
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # approach 型：按当前速度前推 time_before_collision 秒，footprint 撞上点就减速/停，
    # 不需要手调几何。硬性 stop 区见下方注释（地形层偶有误报，默认不开以免原地锁死）。
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 4
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /livox_scan2
      enabled: False

# -----------------------------------------------------------------------------
# 局部代价地图：滚动窗口，global_frame = odom（对 GPS 修正的 map->odom 跳变免疫）
# 障碍源 = /livox_scan2（地面感知 2D scan，来自 cloud_to_2d_laserscan）
# -----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[ [-0.30, -0.25], [-0.3, 0.25],[0.3, 0.25],[0.30, -0.25] ]"
      # terrain_layer 在前写入分级地形代价(渐变+陡坡lethal),obstacle_layer 用 Max 叠加点云障碍。
      plugins: ["terrain_layer", "lawn_layer", "obstacle_layer", "inflation_layer"]

      # 自定义地形代价层：读 terrain_scan 的 /terrain_cost_cloud（cost=0..000, odom 系）。
      # cost<lethal_cost_threshold -> 渐变代价(z缓坡软避让)；>= -> LETHAL(陡坡/路沿)。
      # 自带滚动栅格,随窗口累积持久(60m 内不遗忘),取代旧 StaticLayer(不持久+刷屏)。
      terrain_layer:
        plugin: "terrain_costmap_layer::TerrainLayer"
        enabled: True
        cost_topic: /terrain_cost_cloud
        combination_method: 1
        lethal_cost_threshold: 100.0
        transform_tolerance: 0.3
        # True：像 obstacle_layer 那样，重新扫到就用最新观测覆盖该格（扫到平地→清 FREE，
        # 坡度变化→上下修正）；只有没扫到的格子(坡度未知)才保留旧值。False=旧的只增不减。
        clearing_enabled: True
        # Nav2 ClearEntireCostmap -> TerrainLayer::reset() 时，同时清空持久的
        # elevation source；否则旧 terrain cloud 会很快把刚清的 costmap 灌回来。
        clear_elevation_on_reset: False
        elevation_clear_service: /elevation_mapping_cupy/clear_map

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1
        footprint_clearing_enabled: True
        # scan 已做地面感知过滤，高度范围放宽即可（2D 单线，本无高度维度）。
        min_obstacle_height: -200.0
        max_obstacle_height: 200.0
        observation_sources: lidar_scan
        lidar_scan:
          topic: /livox_scan2
          data_type: "LaserScan"
          clearing: True
          marking: True
          inf_is_valid: True
          observation_persistence: 1.5
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          max_obstacle_height: 200.0
          min_obstacle_height: -200.0

      lawn_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: True
        combination_method: 1            # Max：只抬高，不覆盖 terrain 的 lethal
        use_approximate_time_sync: True  # slop 是源码里硬编码的 100 ms，不可配
        sensor_data_depth: 10
        publish_debug_topics: True       # 调试期打开；出 camera1/tile_map
        observation_sources: "camera1"
        camera1:
          segmentation_topic: /semantic/camera1/segmentation
          pointcloud_topic: /semantic/camera1/points
          labels_topic: /semantic/camera1/label_info
          confidence_topic: /semantic/camera1/confidence
          min_obstacle_distance: 0.4
          max_obstacle_distance: 5.0
          camera_horizontal_fov: 1.379
          camera_vertical_fov: 1.109
          fov_decay_time: -1.0           # 关闭：<0 即禁用
          outside_fov_decay_time: -1.0
          tile_map_decay_time: 3600.0
          observation_persistence: 0.0
          # 刻意为 0：任何正值都会在掉帧时让 isCurrent() 为假，
          # 把整层标成 not-current，从而拖住整张代价图。
          expected_update_rate: 0.0
          use_cost_selection: True       # COST-BASED 选择（日志里会打印这行）
          visualize_tile_map: True
          visualize_frustum_fov: False
          class_types: ["lawn", "road"]
          lawn:
            # "grass" 必须与 LabelInfo 里的 class_name 逐字节相同。
            # 这是 ontology.yaml 里的原名（0=background 1=sidewalk 2=grass）。
            # 不匹配时 class_map 非空（不触发 exit(-1)）但 class_to_id_map 为空，
            # 结果是【整层静默零效果】——最难查的一种失败。
            classes: ["grass"]
            base_cost: 100
            max_cost: 253
            samples_to_max_cost: 3
            mark_confidence: 128         # 要求 softmax 置信度 >=50% 才标记
            dominant_priority: False
          road:
            classes: ["road"]
            base_cost: 170
            max_cost: 220
            samples_to_max_cost: 1
            mark_confidence: 128
            dominant_priority: False
            # 横向引导由 Campus Nav 的路线坐标系适配器负责；图像右侧在
            # 车头朝向路沿时并不等于道路右侧，因此关闭旧的图像梯度。
            lateral_gradient: False
            lateral_right_cost: 110
            lateral_left_cost: 220
            lateral_min_width_pixels: 30

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 20.0
        inflation_radius: 0.5

      always_send_full_costmap: True
# -----------------------------------------------------------------------------
# 全局代价地图：滚动窗口 + 无 static_layer，未知空间视为可通行
# 注意：滚动窗口尺寸(width/height)必须能同时覆盖机器人与当前 GPS 目标；
#   目标更远时应把长距离拆成一串较近的 GPS waypoint（FollowGPSWaypoints）。
# -----------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 200
      height: 200
      resolution: 0.1
      # false：未观测格子当作 FREE，配合 planner allow_unknown:true 可朝远处目标规划。
      track_unknown_space: false
      footprint: "[ [-0.30, -0.25], [-0.3, 0.25],[0.3, 0.25],[0.30, -0.25] ]"
      # terrain_layer 提供全局的分级地形代价 + 陡坡/路沿 lethal，且随 60m 窗口累积持久。
      plugins: ["terrain_layer", "lawn_layer", "obstacle_layer", "inflation_layer"]

      # 自定义地形代价层（同局部）。/terrain_cost_cloud 为 odom 系，层内经 tf 变换到
      # global_frame(map) 并写入自身滚动栅格累积；本机 map->odom 仅平移,变换稳定。
      terrain_layer:
        plugin: "terrain_costmap_layer::TerrainLayer"
        enabled: True
        cost_topic: /terrain_cost_cloud
        combination_method: 1
        lethal_cost_threshold: 100.0
        transform_tolerance: 0.3
        # True：重新扫到就用最新观测覆盖该格（扫到平地→清 FREE，坡度变化→上下修正）；
        # 没扫到的格子(坡度未知)保留旧值。这解决 global 图上地形误报清不掉的问题。
        clearing_enabled: True
        clear_elevation_on_reset: False
        elevation_clear_service: /elevation_mapping_cupy/clear_map

      lawn_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: True
        combination_method: 1
        use_approximate_time_sync: True
        sensor_data_depth: 10
        publish_debug_topics: False
        observation_sources: "camera1"
        camera1:
          segmentation_topic: /semantic/camera1/segmentation
          pointcloud_topic: /semantic/camera1/points
          labels_topic: /semantic/camera1/label_info
          confidence_topic: /semantic/camera1/confidence
          min_obstacle_distance: 0.4
          max_obstacle_distance: 5.0
          camera_horizontal_fov: 1.379
          camera_vertical_fov: 1.109
          fov_decay_time: -1.0
          outside_fov_decay_time: -1.0
          tile_map_decay_time: 3600.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          use_cost_selection: True
          visualize_tile_map: False
          visualize_frustum_fov: False
          class_types: ["lawn", "road"]
          lawn:
            classes: ["grass"]
            base_cost: 100
            # 必须与 local 那份保持一致，改之前先看那里对 253 的完整说明
            # （253 对 NavFn 就是障碍，不是"贵一点"）。
            max_cost: 253
            samples_to_max_cost: 3
            mark_confidence: 128
            dominant_priority: False
          road:
            classes: ["road"]
            base_cost: 170
            max_cost: 220
            samples_to_max_cost: 1
            mark_confidence: 128
            dominant_priority: False
            # 与 local 一致：关闭基于图像列方向的横向梯度。
            lateral_gradient: False
            lateral_right_cost: 110
            lateral_left_cost: 220
            lateral_min_width_pixels: 30

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1
        footprint_clearing_enabled: True
        min_obstacle_height: -200.0
        max_obstacle_height: 200.0
        observation_sources: lidar_scan
        lidar_scan:
          topic: /livox_scan2
          data_type: "LaserScan"
          clearing: True
          marking: True
          inf_is_valid: True
          observation_persistence: 1.0
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          max_obstacle_height: 200.0
          min_obstacle_height: -200.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.6

      always_send_full_costmap: False
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 3.0
      # 室外无地图：允许把路径规划进未知空间，否则目标在感知范围外会规划失败。
      allow_unknown: true
      # 不降采样：降到 0.2 m 后窄路只剩几格，两侧膨胀一压就判不通，
      # 与"宁可钻窄路也别绕远路"的目的相反。代价是 2000x2000 格全分辨率搜索。
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 10000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      # 长条障碍绕行要把整个可达区域展开完，2s 不够会抛 "Planning timed out"；
      # 5.0 是 Nav2 默认。目标真不可达时每次重规划都会搜满窗口耗时数秒，
      # 这是"不误报无路"的代价。
      max_planning_time: 5.0
      # 代价与距离的兑换率。NavFn 把它写死在 COST_NEUTRAL/COST_FACTOR 两个宏里，
      # 换到 Smac 才可调：调小更看重距离、更愿意钻窄路而不是绕远路；0.0 等于完全
      # 不看代价的最短路 A*。1.5 时平地也会绕开地形层的小代价斑块走 S 弯
      # （NavFn 的势场对这些小代价是平均过去的，A* 是逐格精确计价），降到 0.5
      # 只避让真正的高代价区。支持在线改，现场扫值不必重启：
      #   ros2 param set /planner_server GridBased.cost_travel_multiplier 0.5
      cost_travel_multiplier: 1.0
      use_final_approach_orientation: false
      # A* 走 8 邻域，原始输出是 45 度斜边拼出来的阶梯。行为树里没有 SmoothPath
      # 节点，smoother_server 那套接不上，只能靠这个内置平滑器。
      # bag 15:43 反解验证（反解 A* 路径后套 nav2 迭代式模拟）：
      # w_smooth=1.0 时迭代发散（全路径偏差爆到 1e22m，会生成垃圾路径），不可用；
      # w_data 越大越把 A* 台阶形状按比例钉回路径（0.6/0.1 残留 85% = bag 实测的弯）。
      # 验证结论 w_smooth=0.5 + w_data=0.002 + 3000 次迭代：
      #   前5m弦偏 0.68m→0.02m / 1.01m→0.03m，路网自身弯曲保留（全路径弦偏 1.52→1.09m）。
      smoother:
        max_iterations: 3000
        w_smooth: 0.5
        w_data: 0.002
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    # 恢复行为在 odom 系里做碰撞检查，与 local_costmap 一致。
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    # avant(YHS 4WIS)底盘原地旋转启动时轮子要从直行构型摆到±90°旋转构型，
    # 摆轮期间车身被甩出 2.4~5.3 倍过冲（bag 实测峰值 60~115°/s）。Spin 指令
    # 压到 0.12 rad/s(≈6.9°/s)：即使 5 倍过冲峰值也只有 ~34°/s，恢复旋转不再猛甩。
    max_rotational_vel: 0.12
    min_rotational_vel: 0.03
    rotational_acc_lim: 0.1

# GPS 航点跟踪：室外用 FollowGPSWaypoints / FollowWaypoints 逐点推进。
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: False
      waypoint_pause_duration: 2

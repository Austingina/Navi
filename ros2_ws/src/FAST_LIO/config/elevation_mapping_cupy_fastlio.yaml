elevation_mapping_node:
  ros__parameters:
    # FAST-LIO already publishes the timestamped odom->body transform. CuPy
    # transforms every dense body-frame scan into this stable rolling frame.
    map_frame: odom
    base_frame: base_link
    corrected_map_frame: odom

    resolution: 0.1
    map_length: 10.0
    sensor_noise_factor: 0.03
    mahalanobis_thresh: 2.5
    outlier_variance: 0.02
    min_valid_distance: 0.5
    max_height_range: 2.0
    max_ray_length: 10.0

    update_variance_fps: 5.0
    update_pose_fps: 10.0
    map_acquire_fps: 5.0
    publish_statistics_fps: 1.0

    enable_edge_sharpen: true
    enable_visibility_cleanup: true
    enable_drift_compensation: true
    enable_overlap_clearance: false
    enable_pointcloud_publishing: false
    enable_drift_corrected_TF_publishing: false

    # Do not initialize a synthetic flat patch around the robot. Wait for the
    # actual Mid-360 returns instead.
    use_initializer_at_start: false
    initialize_frame_id: [body]
    initialize_tf_offset: [0.0]

    # 真机上 /livox/points 无发布者（robot-sensors 的驱动只发 CustomMsg
    # /livox/front_lidar,/livox/back_lidar）。改吃 FAST-LIO 去畸变后的当前帧, ~10Hz。
    #
    # 该话题的 frame 是 body. body 原点约等于前雷达
    # 光心（差 mid360.yaml 的 extrinsic_T，几厘米），所以对【前】雷达的点，
    # visibility_cleanup 的射线原点基本是对的。
    #
    # 但现在喂进 FAST-LIO 的是前后双雷达的合并点云（lid_topic=/livox/fused_lidar），
    # 合并结果统一在前雷达系里。后雷达的点实际是从它自己的位置发出的，与 body 原点相距
    # 约 0.55 m（标定值 t=[-0.286,+0.448,-0.110]），而这里会把它们也当成从 body 原点
    # 发出 —— 所以 visibility_cleanup 对【后】雷达的点存在该量级的射线原点误差。
    # 单雷达时不存在这个问题。如果日后发现高程图的遮挡清除有异常，先查这一条。
    subscribers:
      mid360:
        topic_name: /cloud_registered_body
        data_type: pointcloud

    publishers:
      elevation_map_raw:
        # layers: [elevation, variance, traversability]
        layers: [elevation]
        basic_layers: [elevation]
        fps: 5.0


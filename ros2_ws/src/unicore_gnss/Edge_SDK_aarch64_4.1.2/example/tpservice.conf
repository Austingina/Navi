#
#服务信息（必填）
#

# 账号
account=AUTEL0002

# 密码
password=6az05177

# 挂载点
mount_point=RTCM33GRCEJ

#
# 服务器配置 (可选)
#

# 服务地址，格式为 hostname:ip，默认 pnt.true-point.com:8801
server=pnt.true-point.com:8801

# 服务端的数据下发时间间隔，单位为秒，默认1
rtcm_interval=1

# 网络传输数据最大等待时间，单位秒， 默认为（数据下发时间间隔+2）
block_time=10

# 坐标系，默认为1
coordinate_sys=1

# 设备ID， 默认为 devid-demo
device_id=device-demo

# 是否在发送GGA时进行重试，默认为1(重试)，0(不重试)
send_gga_with_retry=1

# 重试间隔时间，单位为秒，默认为10秒
retry_interval=10

# 重试次数
retry_number=3

# 认证类型，可选2002(私有协议)、2003(AKAS)
auth_type = 2002

# 是否支持GGA偏移计算，默认为1(支持)，0(不支持)
support_gga_offset=1

# 服务类型，默认为1(NRTK)
server_type=1

# SDK 日志输出等级，可选项：verbose、debug、info、warning、error、none，默认为none
log_level=debug

# Transport Layer Interface option: tcp or ssl
transport_protocol = tcp

# SSL option
server_ssl_verify = cert,cn
server_ssl_path = /etc/ssl/certs/ca-certificates.crt

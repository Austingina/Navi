/**:
  ros__parameters:
    source: pbf
    dev_overlay: false
    gpkg_overlay_table: osmfile
    table: route_edges
    mode: walk
    respect_oneway: false
    allow_private: true
    respect_turns: false
    frame_id: campus_map
    datum_lat: 22.574357630323675
    datum_lon: 113.93507078035577
    max_snap_m: 50.0
    publish_map: false
    publish_network: true
    publish_buildings: true
    building_extruded: true
    building_default_height: 12.0
    building_level_height: 3.0
    buildings_pbf_path: ""
    map_resolution: 3.0
    network_line_width: 1.0
    network_z: -0.3
    network_alpha: 0.92
    goal_navigation_enable: true
    goal_topic: campus_goal_pose
    # 外部中止当前道路级路线：向此话题发 std_msgs/Empty（NaviSkill 室外 pause/cancel）。
    cancel_topic: campus_goal_cancel
    robot_frame: base_link
    nav_waypoints_topic: campus_nav_waypoints
    nav_waypoint_markers_topic: campus_nav_waypoint_markers
    nav_waypoint_spacing_m: 4.0
    # Motor-road whitelist shared by the route-frame semantic adapter.
    # footway/path/pedestrian and every unlisted type remain reference-only.
    road_right_offset_highways:
      [service, residential, unclassified, tertiary, tertiary_link]
    # Legacy fixed shift is disabled. Physical road boundaries now determine d.
    road_right_offset_m: 0.0
    # Closed-loop mode: on the motor-road whitelist, a fresh and costmap-safe
    # measured right-side target replaces the biased OSM waypoint sent to Nav2.
    # Missing/stale/unsafe targets fail closed by cancelling the Nav2 goal.
    semantic_lateral_enabled: true
    semantic_lateral_shadow_mode: false
    semantic_lateral_segmentation_topic: /semantic/camera1/segmentation
    semantic_lateral_confidence_topic: /semantic/camera1/confidence
    semantic_lateral_cloud_topic: /semantic/camera1/points
    semantic_lateral_labels_topic: /semantic/camera1/label_info
    semantic_lateral_road_class: road
    semantic_lateral_min_pixel_confidence: 128
    semantic_lateral_pixel_stride: 2
    # Road mask touching the horizontal image border is a censored free-space
    # frontier, not a measured curb. It may guide SEEK_RIGHT_EDGE but may not
    # update the tracked physical road width.
    semantic_lateral_image_edge_margin_px: 8
    semantic_lateral_max_frame_age_s: 0.8
    semantic_lateral_near_m: 1.0
    semantic_lateral_far_m: 7.0
    semantic_lateral_bin_size_m: 0.5
    semantic_lateral_limit_m: 12.0
    semantic_lateral_min_points_per_bin: 20
    semantic_lateral_width_min_m: 2.5
    semantic_lateral_width_max_m: 15.0
    # Keep the complete 0.75 m safety footprint inside the 10x10 m rolling
    # local costmap even when the robot and target lie on opposite sides of the
    # OSM reference.  A 4 m longitudinal lookahead could put the target just
    # beyond the 5 m half-extent and deadlock closed-loop dispatch.
    semantic_lateral_lookahead_m: 2.5
    # At a sharp or compound junction, pull an out-of-window target back along
    # the selected OSM branch instead of treating unrepresented space as safe
    # or stopping immediately. The full footprint must still pass the costmap.
    semantic_lateral_min_lookahead_m: 0.6
    semantic_lateral_safety_lookahead_step_m: 0.25
    # Nav2's outdoor general goal tolerance is 1.0 m. At sharp offset turns a
    # point 2.5 route-metres ahead can fold back to within that radius and be
    # reported reached immediately, so require a geometric-distance margin.
    semantic_lateral_min_goal_distance_m: 1.3
    semantic_lateral_inside_margin_m: 0.75
    semantic_lateral_min_target_confidence: 0.45
    # SAM3 is intentionally rate-limited and currently arrives near 1 Hz over
    # the routed WLAN.  Two seconds absorbs normal jitter without making a
    # genuinely lost target linger for long.
    semantic_lateral_hold_last_s: 2.0
    semantic_lateral_acquire_frames: 3
    semantic_lateral_max_lateral_step_m: 0.4
    # Fit road center/width as a smooth lateral-offset model relative to the
    # directed OSM route, then filter that model in route coordinates.
    semantic_lateral_filter_alpha: 0.25
    semantic_lateral_fit_max_slope: 0.35
    semantic_lateral_center_innovation_m: 0.6
    semantic_lateral_width_innovation_m: 0.6
    # Freeze width across topological intersections, hold the vehicle's achieved
    # entry offset (no lane change in the junction), and merge overlapping
    # guards for compound junctions. Release after three stable exit frames.
    semantic_lateral_junction_guard_before_m: 4.0
    semantic_lateral_junction_guard_after_m: 3.0
    semantic_lateral_junction_release_frames: 1
    # Blend the OSM tangent through polyline corners so a fixed lateral offset
    # follows a turn continuously instead of jumping when the segment changes.
    semantic_lateral_tangent_window_m: 1.5
    # Replan on meaningful lateral change or longitudinal progress separately.
    # Normal forward motion must not be mistaken for lateral target noise.
    semantic_lateral_target_move_m: 0.8
    semantic_lateral_target_progress_m: 1.5
    # If a newly selected route initially points behind the front camera, use
    # Nav2's collision-checked Spin behavior before requiring a semantic target.
    semantic_lateral_align_heading_enable: true
    semantic_lateral_align_enter_deg: 60.0
    semantic_lateral_align_exit_deg: 20.0
    semantic_lateral_align_action_name: spin
    semantic_lateral_align_timeout_s: 45.0
    semantic_lateral_align_max_retries: 1
    # Fused Nav2 grid includes Livox obstacles + elevation/terrain. Closed-loop
    # mode fails stopped unless the whole target footprint is known and nonlethal.
    semantic_lateral_safety_costmap_topic: /local_costmap/costmap
    semantic_lateral_safety_radius_m: 0.75
    # Search the frozen road corridor at this lateral resolution when a parked
    # vehicle occupies the preferred target. The full footprint remains gated.
    semantic_lateral_safety_inward_step_m: 0.2
    semantic_lateral_avoid_max_lookahead_m: 5.0
    # Hold the selected bypass side until this many clear semantic observations
    # so the target cannot alternate around the obstacle.
    semantic_lateral_avoid_release_frames: 3
    semantic_lateral_lethal_occupancy: 99
    semantic_lateral_costmap_max_age_s: 1.0
    semantic_lateral_debug_topic: /campus_lateral/debug
    semantic_lateral_target_topic: /campus_lateral/adapted_path
    semantic_lateral_status_topic: /campus_lateral/status
    nav_waypoint_marker_size_m: 0.8
    send_to_nav2: true
    nav2_action_name: navigate_through_poses
    nav2_behavior_tree: ""
    # Rolling waypoint batching: keep every Nav2 goal inside the global costmap
    # window. nav2_batch_radius_m must stay < global_costmap half-size (width/2).
    nav2_batch_enable: true
    # 200x200 m rolling global costmap has a 100 m half-size. Keep 10 m for
    # TF jitter, window motion and footprint/inflation near the boundary.
    nav2_batch_radius_m: 90.0
    nav2_batch_advance_m: 5.0
    nav2_reach_tol_m: 2.0
    nav2_batch_period_s: 1.0
    # Final goal specialization: the cursor stops one waypoint short of the route
    # end and the last pose is driven as its own NavigateToPose goal, so
    # nav2_reach_tol_m no longer ends the route metres out. nav2_final_behavior_tree
    # is injected by route_planner.launch.py (an absolute path is required).
    nav2_final_precise_enable: true
    nav2_final_approach_m: 8.0
    nav2_final_reach_tol_m: 0.8
    nav2_final_action_name: navigate_to_pose
    nav2_final_max_retry: 2
    # Off-network goals (plaza / courtyard behind a fence): the goal has no road
    # under it, so it is reached through a hand-authored entry point instead of
    # the geometrically nearest segment. Author the points in QGIS
    # (scripts/make_entries_gpkg.py creates the empty layer); with no points the
    # behavior is exactly as before. entry_gpkg is injected by
    # route_planner.launch.py (an absolute path is required).
    entry_enable: true
    entry_table: entries
    off_network_m: 10.0
    # Also caps the access leg (entry -> goal), which Nav2 plans in one shot:
    # global_costmap is a 200x200 m rolling window centred on the robot, and
    # NavfnPlanner throws GoalOutsideMapBounds past its edge (100 m). If a goal
    # is further than this from every opening the planner warns; add another
    # entry point rather than raising the radius.
    entry_search_radius_m: 50.0
    entry_offroad_weight: 2.0
    # Reject an entry when its straight access line to the off-network point
    # crosses a different campus road. Contact at the entry endpoint is allowed.
    reject_entry_network_crossing: true
    entry_markers_topic: campus_entry_markers
    entry_marker_size_m: 1.0

    # -- road network vs. direct drive ---------------------------------------
    # Following the roads is the safe default: the graph encodes topology the
    # robot cannot see, so it never drives into a fenced dead end. But for a goal
    # a few metres away, or one the roads only reach by going around the block,
    # snapping to the network is a pointless excursion. plan_auto weighs the two
    # by comparing the road route against the straight line; see
    # RouteGraph.plan_auto for the ordered rules. Set false to always follow the
    # road network (behaviour before this was added).
    auto_channel_enable: true
    # Hard ceiling on any hop handed to Nav2 as a single goal. Same 100 m costmap
    # limit that bounds entry_search_radius_m above — keep the two in step.
    direct_max_m: 99.5
    # Below this, drive straight there unconditionally: projecting onto a road
    # and back off it costs more than the trip itself.
    always_direct_m: 8.0
    # Drive direct once the road route is this many times the straight line.
    # 1.0 would always go direct; a very large value always follows the roads.
    detour_ratio_threshold: 1.6
    # An on-road leg no longer than this means both ends attach to the road at
    # the same place, i.e. the route would leave and re-enter through a single
    # opening. Then it is either a straight shot, or — when that exceeds
    # direct_max_m — two hops with the entry as the waypoint between them.
    same_entry_road_m: 2.0
    decision_topic: campus_route_decision

    patrol_enable: true
    patrol_name: patrol_01
    patrol_loop: true
    patrol_sample_m: 5.0
    patrol_corner_angle_deg: 12.0
    patrol_cmd: ""
    patrol_load: ""

# LabelInfo 的类别表 —— 只在 stub 路径下使用（segmentation_trt 自己按
# config/ontology.yaml 发 LabelInfo，不读本文件）。
#
# 必须与 ontology.yaml 【逐字节一致】，否则 stub 与真模型两条路径的 class id
# 含义不同，换路径时层配置就悄悄失效：
#     0 = background   1 = sidewalk   2 = grass
#
# 两个静默失败的坑：
#  1. class_id 必须落在 0..254。消息字段是 uint16，但 semantic_segmentation_layer
#     存进 uint8_t (segmentation_buffer.cpp:113)，>255 会静默截断。
#  2. class_name 必须与 param_outdoor_elevation.yaml 里
#     lawn_layer.camera1.<class_type>.classes 逐字节相同。不匹配时 class_map 非空
#     （所以不会触发 exit(-1)），但 class_to_id_map 为空 -> 整层静默零效果。
label_info_publisher:
  ros__parameters:
    class_ids: [0, 1, 2]
    class_names: ["background", "sidewalk", "grass"]
    threshold: 0.5
    topic: "/semantic/camera1/label_info"
    repeat_period_s: 5.0

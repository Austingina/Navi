[project]
name = "floor-separator"
version = "1.0.0"
description = "Automatic multi-floor LiDAR point cloud segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.2",
    "open3d>=0.18.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
floor-separator = "floor_separator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["floor_separator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

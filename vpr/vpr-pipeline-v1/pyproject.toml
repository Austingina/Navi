[project]
name = "vrr-vpr"
version = "1.1.0"
description = "Visual Place Recognition engine — MegaLoc/SALAD-indoor + FAISS + LightGlue + color re-scoring, with C++ API"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.4",
    "Pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "loguru>=0.7.0",
    "opencv-python-headless>=4.8.0",
    "huggingface-hub>=0.19.0",
    "safetensors>=0.4.0",
    "pybind11>=2.11.0",
    "lightglue",
    "pytorch-lightning>=2.0.0",
    "pytorch-metric-learning>=2.0.0",
]

[tool.uv.sources]
lightglue = { git = "https://github.com/cvg/LightGlue.git" }

[tool.setuptools.packages.find]
include = ["vrr_vpr*"]

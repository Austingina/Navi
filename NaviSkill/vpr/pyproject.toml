[project]
name = "vrr-vpr"
version = "1.1.0"
description = "Visual Place Recognition engine — MegaLoc/SALAD-indoor + FAISS + LightGlue + color re-scoring, with C++ API"
requires-python = ">=3.12"
dependencies = [
    # numpy 2.x to match Ubuntu 24.04 / Python 3.12 and NaviSkill's own pin;
    # torch and faiss lower bounds are the first releases that accept numpy 2.
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy>=2.0,<3",
    "faiss-cpu>=1.8.0",
    "Pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "loguru>=0.7.0",
    "opencv-python-headless>=4.8.0",
    "huggingface-hub>=0.19.0",
    "safetensors>=0.4.0",
    "pybind11>=2.11.0",
    "lightglue",
    "pytorch-lightning>=2.0.0",
    "pytorch-metric-learning>=2.0.0",
]

[tool.uv.sources]
lightglue = { git = "https://github.com/cvg/LightGlue.git" }

[tool.setuptools.packages.find]
include = ["vrr_vpr*"]

session_name: outdoor
# 见 navi.base.yaml 的说明：用 $NAVI_SCRIPT_DIR 而非写死 /home/nvidia，便于跨账号部署。
start_directory: $NAVI_SCRIPT_DIR

# 室外 GPS 栈（session=outdoor）：outdoor_bringup_heading_align（定位 heading-align +
# Nav2 + campus_nav 路网，一条 launch 全包）。不含 NaviSkill/雷达——它们在 session=navi
# 常驻。用 start_outdoor.sh 加载本文件（会先杀 slam 会话，二者互斥）。
# $NAVI_SIM_ARG 由 start_outdoor.sh 注入：-s 时为 "--simulated"（use_sim_time:=true），否则为空。
windows:
  - window_name: outdoor_services
    layout: tiled
    panes:
      - shell_command:
          - sleep 0
          - bash $NAVI_SCRIPT_DIR/start_outdoor.bash $NAVI_SIM_ARG

session_name: navi
start_directory: /home/nvidia/Navi/scripts

windows:
  - window_name: navi_services
    layout: tiled
    panes:
      - shell_command:
          - sleep 2
          - bash $NAVI_SCRIPT_DIR/start_gridmap.bash -v
      - shell_command:
          - sleep 3
          - bash $NAVI_SCRIPT_DIR/start_navigation.bash
      - shell_command:
          - sleep 4
          - bash $NAVI_SCRIPT_DIR/start_mcp.sh
          
  - window_name: monitoring
    panes:
      - shell_command:
          - echo "Use this window for monitoring"
          - htop

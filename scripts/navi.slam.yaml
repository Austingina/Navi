session_name: slam
# 见 navi.base.yaml 的说明：用 $NAVI_SCRIPT_DIR 而非写死 /home/nvidia，便于跨账号部署。
start_directory: $NAVI_SCRIPT_DIR

# SLAM 室内点云定位栈（session=slam）：FAST-LIO 定位 + r1pro Nav2。
# 不含 NaviSkill(start_mcp)/雷达——它们在 session=navi（navi.base.yaml）常驻。
# 用 start_slam.sh 加载本文件（会先杀 outdoor 会话，二者互斥）。
# $NAVI_SIM_ARG 由 start_slam.sh 注入：-s 时为 "--simulated"（use_sim_time:=true），否则为空。
# $NAVI_MAP_PCD 由 start_slam.sh 注入：要加载的点云地图 pcd 路径（空则 start_localization.bash 用默认）。
windows:
  - window_name: slam_services
    layout: tiled
    panes:
      - shell_command:
          - sleep 0
          - bash $NAVI_SCRIPT_DIR/start_localization.bash $NAVI_SIM_ARG -m "$NAVI_MAP_PCD"
      # 不再靠固定 sleep 赌 FAST-LIO 已经定位好：start_navigation.bash 里会等
      # map->base_link 真的出现（仿真下还等 /clock）再起 Nav2。留 2s 只是让上面那
      # 个 pane 先把 launch 拉起来，避免两个 ros2 launch 同时抢终端输出。
      - shell_command:
          - sleep 2
          - bash $NAVI_SCRIPT_DIR/start_navigation.bash $NAVI_SIM_ARG

  - window_name: monitoring
    panes:
      - shell_command:
          - echo "Use this window for monitoring"
          - htop

session_name: navi
start_directory: /home/nvidia/work/Navi/scripts

windows:
  - window_name: navi_services
    layout: tiled
    panes:
      - shell_command:
          - bash $NAVI_SCRIPT_DIR/start_r1pro.bash
      - shell_command:
          - sleep 10
          - bash $NAVI_SCRIPT_DIR/start_lidar.bash
      - shell_command:
          - sleep 20
          - bash $NAVI_SCRIPT_DIR/start_localization.bash
      - shell_command:
          - sleep 30
          - bash $NAVI_SCRIPT_DIR/start_mcp.sh -m http://10.239.18.181:8080/mapserver/408
      - shell_command:
          - sleep 40
          - bash $NAVI_SCRIPT_DIR/start_navigation.bash

  - window_name: monitoring
    panes:
      - shell_command:
          - echo "Use this window for monitoring"
          - htop

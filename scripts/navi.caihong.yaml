session_name: navi
start_directory: /home/nvidia/work/Navi/scripts

windows:
  - window_name: navi_services
    layout: tiled
    panes:
      - shell_command:
          - bash $NAVI_SCRIPT_DIR/start_r1pro.bash
      - shell_command:
          - sleep 10 
          - bash $NAVI_SCRIPT_DIR/start_lidar.bash
      - shell_command:
          - sleep 11
          - bash $NAVI_SCRIPT_DIR/start_localization.bash.caihong
      - shell_command:
          - sleep 12
          - bash $NAVI_SCRIPT_DIR/start_mcp.sh
      - shell_command:
          - sleep 12
          - bash $NAVI_SCRIPT_DIR/start_navigation.launch

  - window_name: monitoring
    panes:
      - shell_command:
          - echo "Use this window for monitoring"
          - htop
